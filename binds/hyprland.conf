# ============================================================================
# karui-oto · binds/hyprland.conf — paste into your hyprland.conf
# ($mainMod is usually SUPER). Change keys to taste.
# Matches `karui-oto binds hyprland` output.
# ============================================================================
bind = $mainMod, O, exec, ~/.local/bin/karui-oto songs
bind = $mainMod, P, exec, ~/.local/bin/karui-oto artists
bind = $mainMod SHIFT, P, exec, ~/.local/bin/karui-oto albums
bind = $mainMod SHIFT, O, exec, ~/.local/bin/karui-oto folders
bind = $mainMod, X, exec, ~/.local/bin/karui-oto kill
bindel = , XF86AudioNext, exec, ~/.local/bin/karui-media next
bindel = , XF86AudioPrev, exec, ~/.local/bin/karui-media prev
bindel = , XF86AudioPlay, exec, ~/.local/bin/karui-media play-pause
